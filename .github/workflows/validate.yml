name: Validate Fourthform system
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fourthform-portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set up Supabase CLI
        id: supabase-cli
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Retry Supabase CLI setup after a transient failure
        if: steps.supabase-cli.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated real Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor 2>&1 | tee /tmp/fourthform-supabase.log
      - name: Configure disposable integration environment
        run: node scripts/ci-environment.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start connected production application
        run: |
          set -a
          source .env.local
          set +a
          npm start > /tmp/fourthform-system.log 2>&1 &
          for i in {1..40}; do curl -fsS http://localhost:4173/start >/dev/null && break; sleep 2; done
      - name: Exercise real accounts, storage, CMS and customer workflows
        run: node tests/browser/connected-system.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-system-evidence
          path: |
            test-results/
            /tmp/fourthform-supabase.log
            /tmp/fourthform-system.log
      - name: Stop disposable services
        if: always()
        run: supabase stop --no-backup
