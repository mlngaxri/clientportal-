project_id = "fourthform-local"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = false
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "100MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173/auth/callback", "http://127.0.0.1:4173/auth/callback", "http://localhost:4173/auth/callback?next=/account/password", "http://127.0.0.1:4173/auth/callback?next=/account/password"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
double_confirm_changes = true
# Disposable development only. Hosted staging and production use verified email.
enable_confirmations = false
